<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여행 가계부</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="여행 가계부">
<meta name="theme-color" content="#24407A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface2:#E9EBE6; --ink:#181C20; --muted:#687078; --line:#D8DBD5;
  --accent:#24407A; --accent-ink:#FFFFFF; --accent-soft:#E3E9F6;
  --cash:#2B7A4B; --cash-soft:#E1F0E6; --card:#7B4FA6; --card-soft:#EEE6F6;
  --neg:#B23F2E; --pos:#2B7A4B; --warn:#9A6A12; --warn-soft:#F6EDD6;
  --shadow:0 10px 30px rgba(24,28,32,.14);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1B1F24; --surface2:#242930; --ink:#ECEEEA; --muted:#98A0A8; --line:#30363D;
    --accent:#8FB1F2; --accent-ink:#0E1626; --accent-soft:#1F2B45;
    --cash:#6CC494; --cash-soft:#163222; --card:#C1A1E6; --card-soft:#2D2238;
    --neg:#E8806F; --pos:#6CC494; --warn:#E2B55A; --warn-soft:#3A2F15;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1B1F24; --surface2:#242930; --ink:#ECEEEA; --muted:#98A0A8; --line:#30363D;
  --accent:#8FB1F2; --accent-ink:#0E1626; --accent-soft:#1F2B45;
  --cash:#6CC494; --cash-soft:#163222; --card:#C1A1E6; --card-soft:#2D2238;
  --neg:#E8806F; --pos:#6CC494; --warn:#E2B55A; --warn-soft:#3A2F15;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hide{display:none!important}

#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
@media (min-width:600px){ body{background:var(--surface2)} #app{box-shadow:0 0 0 1px var(--line);min-height:100vh} }

/* top bar */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
  display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:12px;color:var(--muted);font-family:var(--mono)}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink);background:transparent}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* trips list */
.page{padding:16px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 8px}
.triplist{display:flex;flex-direction:column;gap:10px}
.tripcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.tripcard .name{font-weight:600;font-size:16px;grid-column:1;grid-row:1}
.tripcard .dates{font-family:var(--mono);font-size:12px;color:var(--muted);grid-column:1;grid-row:2}
.tripcard .total{font-family:var(--mono);font-size:16px;font-weight:600;text-align:right;grid-column:2;grid-row:1/3}
.tripcard .tags{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/3;grid-row:3;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);font-weight:500}
.pill.live{background:var(--accent-soft);color:var(--accent)}
.pill.cash{background:var(--cash-soft);color:var(--cash)}
.pill.card{background:var(--card-soft);color:var(--card)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mono{font-family:var(--mono)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:600;
  background:var(--surface2);color:var(--ink);border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;color:var(--neg);border-color:var(--line)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;flex:0 0 auto}

/* summary strip */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 16px 0}
.summary > div{background:var(--surface);padding:10px 12px}
.summary .k{font-size:11.5px;color:var(--muted);font-weight:500}
.summary .v{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallets{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none}
.wallets::-webkit-scrollbar{display:none}
.wallet{flex:0 0 auto;display:flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:10px;background:var(--cash-soft);color:var(--cash);font-size:12.5px;font-weight:500}
.wallet b{font-family:var(--mono);font-weight:600;font-size:13.5px}
.wallet.cardw{background:var(--card-soft);color:var(--card)}
.walletcard.cardw .cur{color:var(--card)}

/* ledger */
.daygroup{margin:18px 16px 0}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:6px;border-bottom:1px dashed var(--line);margin-bottom:4px}
.dayhead .d{font-family:var(--mono);font-weight:600;font-size:13px}
.dayhead .t{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .cat{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.row .main{min-width:0}
.row .memo{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .meta .pm{font-weight:500}
.row .meta .pm.cash{color:var(--cash)} .row .meta .pm.card{color:var(--card)}
.row .amt{text-align:right}
.row .amt .fx{font-family:var(--mono);font-weight:600;font-size:15px;white-space:nowrap}
.row .amt .krw{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.row .amt .krw.plus{color:var(--pos)} .row .amt .fx.plus{color:var(--pos)}
.empty{margin:40px 24px;text-align:center;color:var(--muted);line-height:1.6}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* fab + tabs */
.fab{position:fixed;right:max(16px,calc(50% - 240px + 16px));bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;
  width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;pointer-events:none}
.tabs > div{pointer-events:auto;width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:11.5px;font-weight:500;color:var(--muted)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92dvh;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.sheet header h2{font-size:16px;margin:0;flex:1;font-weight:600}
.sheet .body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
.sheet footer{padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet footer .btn{flex:1}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px;font-family:var(--mono)}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.input.big{font-family:var(--mono);font-size:26px;font-weight:600;padding:8px 12px}
.input.mono{font-family:var(--mono)}
textarea.input{resize:vertical;min-height:60px}
.inline{display:flex;gap:8px;align-items:center}
.inline > *{flex:1;min-width:0}
.inline > .fixed{flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.fixed{flex:0 0 auto;flex-wrap:nowrap}
.row .meta .pill{font-size:10.5px;padding:1px 6px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink)}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.cash.active{background:var(--cash);border-color:var(--cash);color:#fff}
.chip.card.active{background:var(--card);border-color:var(--card);color:#fff}
.chip .code{font-family:var(--mono);font-size:12.5px}
.chip.add{border-style:dashed;color:var(--muted)}
.sharelist{display:flex;flex-direction:column;gap:6px}
.sharelist .inline label{flex:0 0 72px;font-size:13.5px}

/* lists in settings */
.list{display:flex;flex-direction:column;gap:6px}
.list .inline .input{padding:8px 10px}
.x{color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.x:hover{background:var(--surface2);color:var(--neg)}
.x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.x.handle{cursor:grab;touch-action:none;color:var(--muted)}
.x.handle:active{cursor:grabbing}
.drow{border-radius:10px}
.drow.dragging{background:var(--surface);box-shadow:var(--shadow);position:relative;z-index:2;outline:1px solid var(--line)}
.drow.dragging input{background:var(--surface)}
.cgroup{display:flex;flex-direction:column;gap:6px}
.cgroup.dragging{background:var(--surface);box-shadow:var(--shadow);position:relative;z-index:2;outline:1px solid var(--line);border-radius:10px}
.subs{margin-left:30px;padding-left:10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.subs .input{padding:8px 10px;font-size:14px}
.srow.dragging{background:var(--surface);box-shadow:var(--shadow);position:relative;z-index:2;outline:1px solid var(--line);border-radius:10px}
.x:disabled{opacity:.25;cursor:default}
.x:disabled:hover{background:none;color:var(--muted)}

/* cash tab */
.walletcard{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.walletcard .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.walletcard .cur{font-family:var(--mono);font-weight:600;color:var(--cash)}
.walletcard .bal{font-family:var(--mono);font-size:24px;font-weight:600}
.walletcard .rate{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.walletcard .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* settle */
.settlecard{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.settlecard .hd{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center}
table.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:9px 12px;text-align:right;font-family:var(--mono);font-size:13px;border-bottom:1px solid var(--line)}
.tbl th{font-family:var(--sans);font-weight:500;color:var(--muted);font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-family:var(--sans);font-weight:500}
.tbl tr:last-child td{border-bottom:0}
.tbl .pos{color:var(--pos)} .tbl .neg{color:var(--neg)}
.transfer{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.transfer:last-child{border-bottom:0}
.transfer .arrow{color:var(--muted)}
.transfer .amt{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap}
.transfer .to{text-align:left}
.tblwrap{overflow-x:auto}

/* stats */
.bars{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.bars h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted)}
.bar{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.bar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bar .trk{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar .fill.cash{background:var(--cash)} .bar .fill.card{background:var(--card)}
.bar .v{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.bar.sub{padding-left:14px;font-size:12.5px}
.bar.sub .lbl{color:var(--muted)}
.bar.sub .lbl::before{content:'└ ';opacity:.6}
.bar.sub .fill{opacity:.5}
.bar.sub .trk{height:7px}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:50;box-shadow:var(--shadow);max-width:90%;text-align:center}
.notice{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;display:flex;gap:8px;align-items:center}
.notice button{color:inherit;font-weight:600;text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
/* ====================== 상수 ====================== */
const KEY='travel-ledger.v1';
const CURRENCIES=[['KRW','원'],['USD','달러'],['EUR','유로'],['JPY','엔'],['VND','동'],['THB','밧'],['TWD','대만달러'],['CNY','위안'],['HKD','홍콩달러'],['SGD','싱가포르달러'],['PHP','페소'],['MYR','링깃'],['IDR','루피아'],['GBP','파운드'],['AUD','호주달러'],['CHF','스위스프랑'],['CAD','캐나다달러'],['MOP','파타카'],['LAK','낍'],['KHR','리엘']];
const BASE_CURRENCIES=['KRW','USD','EUR','JPY','VND'];
const curName=code=>(CURRENCIES.find(c=>c[0]===code)||[])[1]||'';
const SYM={KRW:'₩',JPY:'¥',USD:'$',VND:'₫',THB:'฿',EUR:'€',TWD:'NT$',CNY:'¥',HKD:'HK$',SGD:'S$',PHP:'₱',MYR:'RM',IDR:'Rp',GBP:'£',AUD:'A$'};
const ZERO_DEC=['KRW','JPY','VND','IDR','TWD'];
// 네이버 환율 표기 기준: 엔·동·루피아·낍·리엘은 100단위, 나머지는 1단위
const UNIT={JPY:100,VND:100,IDR:100,LAK:100,KHR:100};
const unitOf=c=>UNIT[c]||1;
const toDisp=(cur,r)=>Math.round((+r||0)*unitOf(cur)*100)/100;
const fromDisp=(cur,v)=>Math.round((+v||0)/unitOf(cur)*1e8)/1e8;
const CASH_TYPES={init:'보유 현금',exchange:'환전',atm:'ATM 인출',receive:'받음',give:'줌',reexchange:'재환전',adjust:'잔액 보정',topup:'카드 충전',refund:'카드 환급',carry_in:'이월 받음',carry_out:'이월 보냄'};
const CASH_SIGN={init:1,exchange:1,atm:1,receive:1,give:-1,reexchange:-1,adjust:0,topup:1,refund:-1,carry_in:1,carry_out:-1};
const I={
  back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  grip:'<svg viewBox="0 0 24 24"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" stroke-width="3"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></svg>',
  save:'<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>',
  tabLedger:'<svg viewBox="0 0 24 24"><path d="M5 3h14v18l-2.5-1.5L14 21l-2-1.5L10 21l-2.5-1.5L5 21z"/><path d="M9 8h6M9 12h6"/></svg>',

function refreshProvisional(t){ for(const e of t.expenses) if(e.provisional){ const r=defaultRate(t,e.cur,e.pm,e.date); if(r>0)e.rate=r } }
const provisionalCount=t=>t.expenses.filter(e=>e.provisional&&+e.rate>0).length;

const isTopup=id=>{const c=S.settings.cards.find(x=>x.id===id);return !!(c&&c.kind!=='credit')};
function cardWalletBalance(t,cardId,cur){ let b=0; for(const c of t.cash){ if(c.cur!==cur)continue; if(c.wallet==='card'&&c.cardId===cardId) b+=c.type==='refund'?-Math.abs(+c.amount||0):Math.abs(+c.amount||0); if(c.type==='atm'&&c.cardId===cardId&&+c.fromCard>0) b-=+c.fromCard } for(const e of t.expenses) if(e.pm&&e.pm.type==='card'&&e.pm.id===cardId&&e.cur===cur) b-=+e.amount||0; return b }
// 이동평균법: 충전/환전이 들어올 때마다 (남은 잔액×기존 환율 + 새로 낸 원화) ÷ 새 잔액 으로 환율을 다시 잡는다.
// 지출·인출은 잔액만 줄이고 환율은 그대로. upTo를 주면 그 날짜까지의 상태를 돌려준다.
function walletEvents(t,w){ const ev=[];
  for(const c of t.cash){ if(c.cur!==w.cur)continue;
    if(w.kind==='card'){ if(c.wallet==='card'&&c.cardId===w.cardId){ if(c.type==='topup')ev.push({d:c.date,o:0,amt:Math.abs(+c.amount||0),krw:+c.krw||0}); else if(c.type==='refund')ev.push({d:c.date,o:1,amt:-Math.abs(+c.amount||0)}) } else if(c.type==='atm'&&c.cardId===w.cardId&&+c.fromCard>0) ev.push({d:c.date,o:1,amt:-(+c.fromCard)}) }
    else { if(c.wallet==='card')continue; const a=Math.abs(+c.amount||0); const sg=c.type==='adjust'?Math.sign(+c.amount||0):(CASH_SIGN[c.type]||1); if(sg>0){ let krw=+c.krw||0; if(c.type==='receive'&&+c.rate>0)krw=a*(+c.rate); ev.push({d:c.date,o:0,amt:a,krw}) } else if(sg<0) ev.push({d:c.date,o:1,amt:-a}) } }
  for(const e of t.expenses){ if(e.cur!==w.cur||!e.pm)continue; if((w.kind==='card'&&e.pm.type==='card'&&e.pm.id===w.cardId)||(w.kind==='cash'&&e.pm.type==='cash'&&e.pm.id===w.cur)) ev.push({d:e.date,o:2,tm:e.time||'',amt:-(+e.amount||0)}) }
  return ev.sort((a,b)=>(a.d||'').localeCompare(b.d||'')||a.o-b.o||(a.tm||'').localeCompare(b.tm||'')) }
function walletState(t,w,upTo){ let bal=0,avg=0; for(const e of walletEvents(t,w)){ if(upTo&&e.d&&e.d>upTo)break; if(e.amt>0&&e.krw>0){ const base=Math.max(bal,0); avg=avg>0?(base*avg+e.krw)/(base+e.amt):e.krw/e.amt } bal+=e.amt } return {bal,avg} }
function cardAvgRate(t,cardId,cur,upTo){ return walletState(t,{kind:'card',cardId,cur},upTo).avg }
function cardWallets(t){ const m=new Map(); for(const card of topupCards()) for(const c of (t.currencies||[])) if(c.code!=='KRW') m.set(card.id+'|'+c.code,{cardId:card.id,cur:c.code}); for(const c of t.cash) if(c.wallet==='card'&&isTopup(c.cardId)) m.set(c.cardId+'|'+c.cur,{cardId:c.cardId,cur:c.cur}); return [...m.values()] }
const noRateCount=t=>t.expenses.filter(e=>e.cur!=='KRW'&&!(+e.rate>0)).length;
const catName=(t,id)=>((t.categories||[]).find(c=>c.id===id)||{}).name||'기타';
const dec=cur=>ZERO_DEC.includes(cur)?0:2;
function fmt(n,cur){const d=dec(cur);const v=(Math.round(n*100)/100).toLocaleString('ko-KR',{minimumFractionDigits:0,maximumFractionDigits:d});return cur==='KRW'?v+'원':(SYM[cur]||cur+' ')+v}
const fmtKRW=n=>Math.round(n).toLocaleString('ko-KR')+'원';
function fmtRate(cur,rate){ if(cur==='KRW')return '원화'; return unitOf(cur)+' '+cur+' = '+toDisp(cur,rate).toLocaleString('ko-KR',{maximumFractionDigits:2})+'원'}
const DOW=['일','월','화','수','목','금','토'];
function fmtDate(d,withYear){ if(!d)return ''; const [y,m,dd]=d.split('-').map(Number); const dow=DOW[new Date(y,m-1,dd).getDay()]; return (withYear?y+'.':'')+m+'.'+dd+' ('+dow+')'}
function fmtRange(a,b){ if(!a)return ''; const [y1,m1,d1]=a.split('-'); if(!b)return `${y1}.${+m1}.${+d1}~`; const [y2,m2,d2]=b.split('-'); return y1===y2?`${y1}.${+m1}.${+d1}–${+m2}.${+d2}`:`${y1}.${+m1}.${+d1}–${y2}.${+m2}.${+d2}`}
function tripStatus(t){const d=today(); if(t.end&&d>t.end)return 'past'; if(t.start&&d<t.start)return 'future'; return 'live'}
function tripRate(t,cur){ if(cur==='KRW')return 1; const c=(t.currencies||[]).find(c=>c.code===cur); return c?+c.rate||0:0}
const eKRW=e=>Math.round((+e.amount||0)*(+e.rate||0));
function walletBalance(t,cur){ let b=0; for(const c of t.cash) if(c.cur===cur&&c.wallet!=='card') b+=signedCash(c); for(const e of t.expenses) if(e.pm&&e.pm.type==='cash'&&e.pm.id===cur) b-=+e.amount||0; return b }
const signedCash=c=>c.type==='adjust'?(+c.amount||0):(CASH_SIGN[c.type]||1)*Math.abs(+c.amount||0);
function walletAvgRate(t,cur){ if(cur==='KRW')return 1; let a=0,k=0; for(const c of t.cash) if(c.cur===cur&&['exchange','atm','carry_in'].includes(c.type)&&+c.krw>0){a+=Math.abs(+c.amount);k+=+c.krw} return a>0?k/a:tripRate(t,cur) }
function tripTotal(t){return t.expenses.reduce((s,e)=>s+eKRW(e),0)}
function eShares(e){ const krw=eKRW(e); const out={}; const split=e.split&&e.split.length?e.split:[e.payer]; if(e.splitMode==='custom'&&e.shares){ let sum=0; for(const m of split){const v=+e.shares[m]||0; sum+=v} for(const m of split){ out[m]=sum>0?Math.round(krw*(+e.shares[m]||0)/sum):Math.round(krw/split.length) } } else { const each=Math.floor(krw/split.length); let rem=krw-each*split.length; for(const m of split){ out[m]=each+(rem>0?1:0); if(rem>0)rem-- } } return out }
function myShare(t){ const me=meId(t); return t.expenses.reduce((s,e)=>s+(eShares(e)[me]||0),0) }
function toast(msg){ const r=document.getElementById('toastRoot'); r.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>r.innerHTML='',2200) }

/* ====================== 정산 ====================== */
function settle(t){
  const me=meId(t); const net={}; (t.members||[]).forEach(m=>net[m.id]={paid:0,owed:0,transfer:0,net:0});
  for(const e of t.expenses){ const krw=eKRW(e); if(net[e.payer])net[e.payer].paid+=krw; const sh=eShares(e); for(const m in sh){ if(!net[m])net[m]={paid:0,owed:0,transfer:0,net:0}; net[m].owed+=sh[m] } }
  for(const c of t.cash){ if((c.type==='give'||c.type==='receive')&&c.memberId&&net[c.memberId]&&net[me]){ const krw=Math.round(Math.abs(+c.amount)*(+c.rate||walletAvgRate(t,c.cur))); if(c.type==='give'){net[me].transfer+=krw;net[c.memberId].transfer-=krw}else{net[me].transfer-=krw;net[c.memberId].transfer+=krw} } }
  for(const m in net) net[m].net=net[m].paid-net[m].owed+net[m].transfer;
  const cred=Object.entries(net).filter(([,v])=>v.net>0).map(([m,v])=>({m,v:v.net})).sort((a,b)=>b.v-a.v);
  const debt=Object.entries(net).filter(([,v])=>v.net<0).map(([m,v])=>({m,v:-v.net})).sort((a,b)=>b.v-a.v);
  const transfers=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){ const x=Math.min(debt[i].v,cred[j].v); if(x>0)transfers.push({from:debt[i].m,to:cred[j].m,amount:x}); debt[i].v-=x; cred[j].v-=x; if(debt[i].v<=0)i++; if(cred[j].v<=0)j++ }
  return {net,transfers}
}
function settleText(t){ const {net,transfers}=settle(t); const lines=[`[${t.name} ${fmtRange(t.start,t.end)} 정산]`,`총 지출 ${fmtKRW(tripTotal(t))}`,'']; for(const m in net)lines.push(`${memberName(t,m)}: 낸 돈 ${fmtKRW(net[m].paid)} / 부담 ${fmtKRW(net[m].owed)}`); lines.push(''); if(!transfers.length)lines.push('정산할 금액이 없어요'); for(const x of transfers)lines.push(`${memberName(t,x.from)} → ${memberName(t,x.to)} ${fmtKRW(x.amount)}`); return lines.join('\n') }

function viewLedger(t){
  const td=today(); const todaySum=t.expenses.filter(e=>e.date===td).reduce((s,e)=>s+eKRW(e),0);
  const wallets=(t.currencies||[]).filter(c=>c.code!=='KRW').map(c=>`<div class="wallet">${esc(c.code)} 현금 <b>${fmt(walletBalance(t,c.code),c.code)}</b></div>`).join('')+cardWallets(t).filter(w=>cardWalletBalance(t,w.cardId,w.cur)!==0).map(w=>`<div class="wallet cardw">${esc(cardName(w.cardId))} ${esc(w.cur)} <b>${fmt(cardWalletBalance(t,w.cardId,w.cur),w.cur)}</b></div>`).join('');
  const byDay={}; for(const e of t.expenses){(byDay[e.date]=byDay[e.date]||[]).push(e)}
  const days=Object.keys(byDay).sort().reverse();

function viewStats(t){
  const total=tripTotal(t); if(!total) return `<div class="empty"><b>아직 통계가 없어요</b>지출을 기록하면 카테고리·결제수단·날짜별로 정리돼요.</div>`;
  const group=(keyFn)=>{const m={}; for(const e of t.expenses){const k=keyFn(e); m[k]=(m[k]||0)+eKRW(e)} return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const bars=(title,entries,cls)=>{const max=Math.max(...entries.map(x=>x[1]),1); return `<div class="bars"><h3>${title}</h3>${entries.map(([k,v])=>`<div class="bar"><span class="lbl">${esc(k)}</span><div class="trk"><div class="fill ${cls?cls(k):''}" style="width:${Math.max(2,v/max*100)}%"></div></div><span class="v">${fmtKRW(v)} <span class="muted">${Math.round(v/total*100)}%</span></span></div>`).join('')}</div>`};
  const catBars=()=>{ const cats=t.categories||[]; const main={},sub={}; for(const e of t.expenses){ const k=e.cat||'_'; main[k]=(main[k]||0)+eKRW(e); const sk=k+'|'+(e.sub||''); sub[sk]=(sub[sk]||0)+eKRW(e) } const entries=Object.entries(main).sort((a,b)=>b[1]-a[1]); const max=Math.max(...entries.map(x=>x[1]),1);
    const row=(label,v,cls)=>`<div class="bar ${cls}"><span class="lbl">${esc(label)}</span><div class="trk"><div class="fill" style="width:${Math.max(2,v/max*100)}%"></div></div><span class="v">${fmtKRW(v)} <span class="muted">${Math.round(v/total*100)}%</span></span></div>`;
    return `<div class="bars"><h3>카테고리별</h3>${entries.map(([k,v])=>{ const c=cats.find(x=>x.id===k); const subs=(c&&c.subs)||[]; const srows=subs.length?[...subs.map(x=>[x.name,sub[k+'|'+x.id]||0]),['구분 없음',sub[k+'|']||0]].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]):[]; return row(catName(t,k),v,'')+srows.map(([n,sv])=>row(n,sv,'sub')).join('') }).join('')}</div>` };
  const byPm=group(e=>pmLabel(t,e.pm)); const pmCls=k=>k.endsWith('현금')?'cash':'card';
  const byDay=group(e=>fmtDate(e.date)).sort((a,b)=>a[0].localeCompare(b[0],'ko',{numeric:true}));
  const byCashCard=[['현금',0],['카드',0]]; for(const e of t.expenses){ byCashCard[e.pm&&e.pm.type==='cash'?0:1][1]+=eKRW(e) }

  const catUsedSub=id=>!isNew&&(t.expenses||[]).some(e=>e.sub===id);
  const openSubs=new Set();
  const renderCats=()=>{ cEl.innerHTML=wc.map(c=>`<div class="cgroup" data-row="${c.id}"><div class="inline drow"><button type="button" class="x handle fixed" data-handle="main" title="끌어서 순서 바꾸기">${I.grip}</button><input class="input" data-cid="${c.id}" value="${esc(c.name)}" placeholder="분류 이름"><button type="button" class="btn sm ghost fixed" data-subtoggle="${c.id}">${(c.subs||[]).length?'세부 '+(c.subs||[]).length:'세부'}</button><button type="button" class="x fixed" data-cdel="${c.id}">${I.x}</button></div>
    <div class="subs ${(c.subs||[]).length||openSubs.has(c.id)?'':'hide'}" data-subs="${c.id}">${(c.subs||[]).map(x=>`<div class="inline srow" data-srow="${x.id}"><button type="button" class="x handle fixed" data-handle="sub">${I.grip}</button><input class="input" data-sid="${x.id}" value="${esc(x.name)}" placeholder="소분류 이름"><button type="button" class="x fixed" data-sdel="${x.id}">${I.x}</button></div>`).join('')}<div class="inline"><input class="input" data-newsub="${c.id}" placeholder="소분류 추가 (예: 식사, 간식)"><button type="button" class="btn sm fixed" data-addsub="${c.id}">추가</button></div></div></div>`).join('')+`<div class="inline"><input class="input" id="newCat" placeholder="분류 추가 (예: 투어, 유심)"><button type="button" class="btn sm fixed" id="addCat">추가</button></div>` };
  form.addEventListener('input',ev=>{ const i=ev.target; if(i.dataset.mid){const m=wm.find(x=>x.id===i.dataset.mid); if(m)m.name=i.value} if(i.dataset.cid){const c=wc.find(x=>x.id===i.dataset.cid); if(c)c.name=i.value} if(i.dataset.sid){ for(const c of wc){const x=(c.subs||[]).find(y=>y.id===i.dataset.sid); if(x){x.name=i.value;break}} } });
  form.addEventListener('keydown',ev=>{ if(ev.key!=='Enter')return; const id=ev.target.id; if(id==='newMember'){ev.preventDefault();form.querySelector('#addMember').click()} if(id==='newCat'){ev.preventDefault();form.querySelector('#addCat').click()} if(id==='customCur'){ev.preventDefault();form.querySelector('#addCur').click()} if(ev.target.dataset.newsub){ev.preventDefault();form.querySelector(`[data-addsub="${ev.target.dataset.newsub}"]`).click()} });
  form.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b)return;
    if(b.id==='addCur'){ const inp=form.querySelector('#customCur'); const v=inp.value.trim(); if(!v)return; const hit=CURRENCIES.find(([c,nm])=>c===v.toUpperCase()||nm===v||nm.replace('달러','')===v.replace('달러','')&&v.length>1); const code=hit?hit[0]:v.toUpperCase().replace(/[^A-Z]/g,''); if(code.length!==3){toast('통화 이름(밧, 대만달러)이나 영문 코드 3자(THB)로 적어 주세요');return} const g=form.querySelector('[data-group="cur"]'); if(!g.querySelector(`[data-chip="${code}"]`)){ const c=document.createElement('button'); c.type='button'; c.className='chip'; c.dataset.chip=code; c.innerHTML=`<span class="code">${code}</span> ${curName(code)}`; g.appendChild(c) } setGroup(form,'cur',[...new Set([...groupValue(form,'cur'),code])]); inp.value='' }
    if(b.id==='addMember'){ const inp=form.querySelector('#newMember'); const v=inp.value.trim(); if(!v)return; wm.push({id:uid(),name:v}); renderMembers(); form.querySelector('#newMember').focus() }
    if(b.dataset.msug){ wm.push({id:uid(),name:b.dataset.msug}); renderMembers() }
    if(b.dataset.mdel){ if(memberUsed(b.dataset.mdel)){toast('이 사람이 들어간 지출이 있어서 뺄 수 없어요');return} const i=wm.findIndex(m=>m.id===b.dataset.mdel); if(i>=0)wm.splice(i,1); renderMembers() }
    if(b.id==='addCat'){ const inp=form.querySelector('#newCat'); const v=inp.value.trim(); if(!v)return; wc.push({id:uid(),name:v,subs:[]}); renderCats(); form.querySelector('#newCat').focus() }
    if(b.dataset.subtoggle){ const id=b.dataset.subtoggle; const box=form.querySelector(`[data-subs="${id}"]`); const c=wc.find(x=>x.id===id); if((c.subs||[]).length){ box.classList.toggle('hide') } else { if(openSubs.has(id))openSubs.delete(id); else openSubs.add(id); box.classList.toggle('hide',!openSubs.has(id)); if(openSubs.has(id))box.querySelector('[data-newsub]').focus() } }
    if(b.dataset.addsub){ const id=b.dataset.addsub; const inp=form.querySelector(`[data-newsub="${id}"]`); const v=inp.value.trim(); if(!v)return; const c=wc.find(x=>x.id===id); c.subs=c.subs||[]; c.subs.push({id:uid(),name:v}); openSubs.add(id); renderCats(); form.querySelector(`[data-newsub="${id}"]`).focus() }
    if(b.dataset.sdel){ const sid=b.dataset.sdel; if(catUsedSub(sid)&&!b.dataset.armed){b.dataset.armed='1';b.style.color='var(--neg)';toast('이 소분류로 적은 지출이 있어요. 한 번 더 누르면 지우고, 그 지출은 "구분 없음"이 돼요');return} for(const c of wc){ const i=(c.subs||[]).findIndex(x=>x.id===sid); if(i>=0){c.subs.splice(i,1);openSubs.add(c.id);break} } renderCats() }
    if(b.dataset.cdel){ if(catUsed(b.dataset.cdel)&&!b.dataset.armed){b.dataset.armed='1';b.style.color='var(--neg)';toast('이 분류로 적은 지출이 있어요. 한 번 더 누르면 지우고, 그 지출은 "기타"로 보여요');return} const i=wc.findIndex(c=>c.id===b.dataset.cdel); if(i>=0)wc.splice(i,1); renderCats() } });
  cEl.addEventListener('pointerdown',ev=>{ const h=ev.target.closest('[data-handle]'); if(!h)return; const isSub=h.dataset.handle==='sub'; const sel=isSub?'.srow':'.cgroup'; const row=h.closest(sel); if(!row)return; const cont=isSub?row.parentElement:cEl; ev.preventDefault(); const body=form.querySelector('.body'); row.classList.add('dragging'); try{h.setPointerCapture(ev.pointerId)}catch(e){}
    const move=e=>{ const y=e.clientY; const rows=[...cont.querySelectorAll(':scope > '+sel)].filter(r=>r!==row); const after=rows.find(r=>{const b=r.getBoundingClientRect(); return y<b.top+b.height/2});
      if(after){ if(row.nextElementSibling!==after) cont.insertBefore(row,after) } else { const last=rows[rows.length-1]; if(last&&last.nextElementSibling!==row) cont.insertBefore(row,last.nextElementSibling) }
      const bb=body.getBoundingClientRect(); if(y<bb.top+48)body.scrollTop-=10; else if(y>bb.bottom-48)body.scrollTop+=10 };
    const up=e=>{ h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',up); h.removeEventListener('pointercancel',up); try{h.releasePointerCapture(e.pointerId)}catch(err){} row.classList.remove('dragging');
      if(isSub){ const c=wc.find(x=>x.id===cont.dataset.subs); const order=[...cont.querySelectorAll(':scope > .srow')].map(r=>r.dataset.srow); if(c)c.subs.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id)) } else { const order=[...cEl.querySelectorAll(':scope > .cgroup')].map(r=>r.dataset.row); wc.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id)) } };
    h.addEventListener('pointermove',move); h.addEventListener('pointerup',up); h.addEventListener('pointercancel',up) });
  renderMembers(); renderCats();
}

/* ---------- 설정 ---------- */
function settingsSheet(){
  const cards=S.settings.cards;
  const body=`<div class="field"><label>카드 (애칭)</label><div class="list" id="cardList">${cards.map(c=>`<div class="inline"><input class="input" data-id="${c.id}" value="${esc(c.name)}"><button type="button" class="chip fixed ${c.kind==='credit'?'card active':''}" data-kind="${c.id}" title="눌러서 체크/신용 바꾸기">${c.kind==='credit'?'신용':'체크'}</button><button type="button" class="x fixed" data-del="${c.id}">${I.x}</button></div>`).join('')}<div class="inline"><input class="input" id="newCard" placeholder="예: 트래블월렛, 하나 비바X"><div class="chips fixed" data-group="newKind" data-multi="0"><button type="button" class="chip active" data-chip="debit">체크</button><button type="button" class="chip card" data-chip="credit">신용</button></div><button type="button" class="btn sm fixed" id="addCard">추가</button></div></div><div class="hint">체크카드는 트래블월렛·트래블로그처럼 앱에서 외화를 충전해 쓰는 카드예요. 현금 탭에서 충전과 잔액을 관리하고, 그 카드로 쓴 지출은 충전 환율로 계산해요. 신용카드는 원화로 청구되니 지출 때 환율 칸이 나와요.</div></div>
  <div class="field"><label>화면</label><div class="chips" data-group="theme"><button type="button" class="chip" data-chip="">시스템</button><button type="button" class="chip" data-chip="light">밝게</button><button type="button" class="chip" data-chip="dark">어둡게</button></div></div>`;
  const form=openSheet('설정',body,{submitLabel:'닫기',onSubmit:()=>{save();render()}});
  setGroup(form,'theme',(()=>{try{return localStorage.getItem(KEY+'.theme')||''}catch(e){return ''}})());
  form.addEventListener('chipchange',ev=>{ if(ev.detail.name==='theme'){ const v=groupValue(form,'theme')||''; try{localStorage.setItem(KEY+'.theme',v)}catch(e){} applyTheme() } });
  form.addEventListener('input',ev=>{ const inp=ev.target; if(inp.dataset.id){ const c=cards.find(x=>x.id===inp.dataset.id); if(c)c.name=inp.value } });
  form.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&ev.target.id==='newCard'){ev.preventDefault();form.querySelector('#addCard').click()} });
  form.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b)return;
    if(b.id==='addCard'){ const inp=form.querySelector('#newCard'); const v=inp.value.trim(); if(!v)return; cards.push({id:uid(),name:v,kind:groupValue(form,'newKind')||'debit'}); save(); rerender() }
    if(b.dataset.kind){ const c=cards.find(x=>x.id===b.dataset.kind); if(c){c.kind=c.kind==='credit'?'debit':'credit'; save(); rerender()} }
    if(b.dataset.del){ const id=b.dataset.del; const used=S.trips.some(t=>t.expenses.some(e=>e.pm&&e.pm.type==='card'&&e.pm.id===id)||t.cash.some(c=>c.cardId===id)); if(used&&!b.dataset.armed){b.dataset.armed='1';b.style.color='var(--neg)';toast('이 카드로 적은 지출이 있어요. 한 번 더 누르면 지워요');return} S.settings.cards=cards.filter(x=>x.id!==id); save(); rerender() } });
  function rerender(){ closeSheet(); settingsSheet() }
}
function applyTheme(){ const v=(()=>{try{return localStorage.getItem(KEY+'.theme')||''}catch(e){return ''}})(); if(v)document.documentElement.dataset.theme=v; else delete document.documentElement.dataset.theme }

/* ---------- 백업 ---------- */
function backupSheet(){
  const json=JSON.stringify(S);
  const body=`<div class="small muted">데이터는 이 폰의 브라우저 안에만 있어요. 폰을 바꾸거나 브라우저 데이터를 지우면 사라지니, 여행이 끝날 때마다 아래 내용을 복사해서 메모 앱 같은 곳에 보관해 두세요.</div>
  ${field('내보내기',`<textarea class="input mono small" id="exportBox" readonly rows="5">${esc(json)}</textarea><div class="inline" style="margin-top:8px"><button type="button" class="btn sm" id="copyBtn">전체 복사</button><button type="button" class="btn sm ghost" id="dlBtn">파일로 저장</button></div>`,`${S.trips.length}개 여행 · ${Math.round(json.length/1024)}KB`)}
  ${field('가져오기',`<textarea class="input mono small" id="importBox" rows="4" placeholder="백업해 둔 내용을 붙여넣기"></textarea><div class="inline" style="margin-top:8px"><button type="button" class="btn sm" id="mergeBtn">여행 합치기</button><button type="button" class="btn sm danger" id="replaceBtn">전체 덮어쓰기</button></div>`,'합치기는 같은 여행이 있으면 건너뛰고 새 여행만 추가해요')}`;
  const form=openSheet('백업',body,{submitLabel:'닫기',onSubmit:()=>{}});
  form.querySelector('#copyBtn').addEventListener('click',async()=>{ const box=form.querySelector('#exportBox'); try{await navigator.clipboard.writeText(json);toast('복사했어요')}catch(e){box.select();try{document.execCommand('copy');toast('복사했어요')}catch(e2){toast('길게 눌러 직접 복사해 주세요')}} });
  form.querySelector('#dlBtn').addEventListener('click',()=>{ try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=`여행가계부-${today()}.json`;a.click();toast('저장을 시작했어요. 안 되면 복사를 써 주세요')}catch(e){toast('이 환경에선 파일 저장이 막혀 있어요. 복사를 써 주세요')} });
  const parse=()=>{ try{const d=JSON.parse(form.querySelector('#importBox').value); if(!d||!Array.isArray(d.trips))throw 0; return d}catch(e){toast('형식이 맞지 않아요. 백업한 내용 전체를 붙여넣어 주세요');return null} };
  form.querySelector('#mergeBtn').addEventListener('click',()=>{ const d=parse(); if(!d)return; migrate(d); let n=0; for(const it of (d.settings.cards||[])) if(!S.settings.cards.some(x=>x.id===it.id)) S.settings.cards.push(it); for(const t of d.trips) if(!S.trips.some(x=>x.id===t.id)){S.trips.push(t);n++} save(); closeSheet(); render(); toast(`${n}개 여행을 가져왔어요`) });
  const rb=form.querySelector('#replaceBtn'); rb.addEventListener('click',()=>{ if(!rb.dataset.armed){rb.dataset.armed='1';rb.textContent='정말 덮어쓰기';return} const d=parse(); if(!d)return; migrate(d); S=d; save(); V={screen:'trips',tripId:null,tab:'ledger'}; closeSheet(); render(); toast('덮어썼어요') });
}

/* ====================== 액션 ====================== */
const ACTIONS={
  'open-trip':d=>{V={screen:'trip',tripId:d.id,tab:'ledger'};render()},
  'go-trips':()=>{V={screen:'trips',tripId:null,tab:'ledger'};render()},
  'tab':d=>{V.tab=d.tab;render()},
  'new-trip':()=>tripForm(),
  'edit-trip':()=>tripForm(getTrip(V.tripId)),
  'settings':()=>settingsSheet(),
  'backup':()=>backupSheet(),
  'new-expense':()=>expenseForm(getTrip(V.tripId)),
  'edit-expense':d=>{const t=getTrip(V.tripId);expenseForm(t,t.expenses.find(e=>e.id===d.id))},
  'new-cash':d=>cashForm(getTrip(V.tripId),null,{cur:d.cur,type:d.type,cardId:d.card}),
  'edit-cash':d=>{const t=getTrip(V.tripId);cashForm(t,t.cash.find(c=>c.id===d.id))},
  'carry':d=>carryForm(getTrip(V.tripId),d.cur),
  'copy-settle':async()=>{const text=settleText(getTrip(V.tripId)); try{await navigator.clipboard.writeText(text);toast('정산 내용을 복사했어요')}catch(e){ openSheet('정산 내용',`<textarea class="input mono small" rows="10" readonly>${esc(text)}</textarea><div class="small muted">길게 눌러 복사해 주세요</div>`,{submitLabel:'닫기'}) }},
  'delete-expense':(d,el)=>armed(el,()=>{const t=getTrip(V.tripId);t.expenses=t.expenses.filter(e=>e.id!==d.id);save();closeSheet();render();toast('지웠어요')}),
  'delete-cash':(d,el)=>armed(el,()=>{const t=getTrip(V.tripId);t.cash=t.cash.filter(c=>c.id!==d.id);refreshProvisional(t);save();closeSheet();render();toast('지웠어요')}),
  'delete-trip':(d,el)=>armed(el,()=>{S.trips=S.trips.filter(t=>t.id!==d.id);save();closeSheet();V={screen:'trips',tripId:null,tab:'ledger'};render();toast('여행을 지웠어요')},'한 번 더 누르면 여행 전체가 지워져요'),
};
function armed(el,fn,msg){ if(el.dataset.armed){fn();return} el.dataset.armed='1'; const old=el.textContent; el.textContent='정말 삭제'; toast(msg||'한 번 더 누르면 지워요'); setTimeout(()=>{delete el.dataset.armed; if(el.isConnected)el.textContent=old},3000) }
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]'); if(!el)return; const fn=ACTIONS[el.dataset.act]; if(fn)fn(el.dataset,el,ev)});

applyTheme(); render();
if('serviceWorker' in navigator){ try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){} }
</script>
</body>
</html>
